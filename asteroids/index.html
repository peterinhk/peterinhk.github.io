<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta http-equiv="Content-type" content="text/html;charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Asteroids</title>
  <link rel="stylesheet" href="style.css" type="text/css"/>
  <style>
    #touch-controls {
      display: none;
    }
    @media (pointer: coarse) {
      #touch-controls {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 16px;
        box-sizing: border-box;
        pointer-events: none;
        z-index: 10;
      }
      #touch-controls > div {
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }
      .touch-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.5);
        color: #fff;
        font: bold 22px sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .touch-btn:active {
        background: rgba(255, 255, 255, 0.35);
      }
      #touch-fire {
        width: 84px;
        height: 84px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
<div id="asteroids">Asteroids game goes here!</div>

<div id="touch-controls">
  <div>
    <div class="touch-btn" data-code="ArrowLeft">&#8592;</div>
    <div class="touch-btn" data-code="ArrowUp">&#8593;</div>
    <div class="touch-btn" data-code="ArrowRight">&#8594;</div>
  </div>
  <div>
    <div class="touch-btn" id="touch-fire" data-code="Space">FIRE</div>
  </div>
</div>

<script src="asteroids.js" type="text/ecmascript"></script>
<script>
  (function () {
    function fireKey(type, code) {
      window.dispatchEvent(new KeyboardEvent(type, { code: code, bubbles: true, cancelable: true }));
    }
    document.querySelectorAll('.touch-btn').forEach(function (btn) {
      var code = btn.getAttribute('data-code');
      var press = function (e) { e.preventDefault(); fireKey('keydown', code); };
      var release = function (e) { e.preventDefault(); fireKey('keyup', code); };
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
    });
  })();
</script>
</body>
</html>
