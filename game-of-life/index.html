<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conway's Game of Life (Rust + WebAssembly)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px;
      text-align: center;
    }
    p.subtitle {
      margin: 0 0 16px;
      font-size: 13px;
      color: #999;
      text-align: center;
    }
    #controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    button {
      font-size: 16px;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #222;
      color: #eee;
      cursor: pointer;
    }
    button:active {
      background: #333;
    }
    #game-of-life-canvas {
      max-width: 100%;
      height: auto;
      touch-action: manipulation;
      background: #fff;
      border-radius: 4px;
    }
    #fps {
      white-space: pre;
      font-family: monospace;
      font-size: 11px;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Conway's Game of Life</h1>
  <p class="subtitle">Rust, compiled to WebAssembly. Tap a cell to toggle it.</p>
  <div id="controls">
    <button id="play-pause"></button>
    <button id="reset-random">Reset</button>
  </div>
  <canvas id="game-of-life-canvas"></canvas>
  <div id="fps"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
