<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a1a1a" />
<title>Wheel of Luck</title>
<script>
  // Parse query parameters for customization
  const urlParams = new URLSearchParams(window.location.search);
  
  // Optional: items - comma-separated list
  const itemsParam = urlParams.get('items');
  if (itemsParam) {
    window.customItems = itemsParam.split(',').map(item => item.trim()).filter(item => item.length > 0);
  }
  
  // Optional: title - page title and visible h1
  const titleParam = urlParams.get('title');
  if (titleParam) {
    document.title = titleParam;
    // We'll update the h1 after DOM loads
    window.customTitle = titleParam;
  }
</script>
<style>
  * {box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
  html, body {height: 100%; overflow: hidden; overscroll-behavior: none;}
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {font-size: clamp(1.5rem, 5vw, 2.5rem); margin: 0 0 1rem; color: #333;}
  .wheel-container {position: relative; display: inline-block; flex-shrink: 0;}
  #wheelCanvas {background: #fff; display: block; border-radius: 50%; box-shadow: 0 8px 30px rgba(0,0,0,0.15);}
  #pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(24px, 5vw, 36px);
    pointer-events: none;
    color: #333;
    line-height: 1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }
  .controls {margin-top: clamp(1rem, 4vh, 1.5rem); display: flex; flex-direction: column; align-items: center; gap: 1rem; width: 100%; max-width: 500px; padding: 0 1rem;}
  #spinBtn {
    appearance: none;
    padding: clamp(14px, 3vh, 18px) clamp(40px, 10vw, 60px);
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 600;
    font-family:    color: #fff;
    background: linear-gradient(135deg, #F06292 0%, #BA68C8 50%, #4FC3F7 100%);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    box-shadow: 0 6px 20px rgba(240, 98, 146, 0.4), 0 2px 6px rgba(186, 104, 200, 0.3);
    transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
    min-height: 56px;
    min-width: 140px;
  }
  #spinBtn:active {transform: scale(0.96); box-shadow: 0 2px 8px rgba(240, 98, 146, 0.4); filter: brightness(1.1);}
  #spinBtn:focus-visible {outline: 3px solid #F06292; outline-offset: 4px;}
  .item-list {display: none;}
  #resultDisplay {
    margin-top: 1rem;
    padding: clamp(12px, 3vw, 16px) clamp(16px, 4vw, 24px);
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    min-height: 60px;
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 600;
    color: #333;
    display: none;
    max-width: 90vw;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    animation: fadeIn 0.3s ease-out;
  }
  #resultDisplay.show {display: block;}
  #tributeText {font-size: clamp(200%, 8vw, 300%); color: #e53935; margin-top: 0.5rem; text-shadow: 0 2px 8px rgba(229,57,53,0.3);}
  @keyframes fadeIn {from {opacity: 0; transform: translateY(-10px) scale(0.98);} to {opacity: 1; transform: translateY(0) scale(1);}}
  #fireworksCanvas {position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; display: none;}
  #fireworksCanvas.active {display: block;}
  @media (max-width: 480px) {
    body {padding: 1rem;}
    h1 {margin-bottom: 0.75rem;}
    .wheel-container {max-width: 100vw;}
    #wheelCanvas {width: 100%; height: auto;}
    #spinBtn {width: 100%; max-width: 320px;}
  }
  @media (prefers-reduced-motion: reduce) {
    #spinBtn, #resultDisplay, #tributeText {animation: none; transition: none;}
  }
</style>
</head>
<body>
<h1>Wheel of Luck</h1>
<script>
  if (window.customTitle) {
    document.querySelector('h1').textContent = window.customTitle;
  }
</script>
<div class="wheel-container">
  <canvas id="wheelCanvas"></canvas>
  <div id="pointer">▼</div>
</div>
<div class="controls">
  <button id="spinBtn">Spin</button>
</div>
<div class="item-list" style="display:none;">
  <h3>Items</h3>
  <input type="text" id="newItem" placeholder="New item" />
  <button id="addItemBtn">Add</button>
  <ul id="itemsUl"></ul>
</div>
<div id="resultDisplay">
  <div>Tribute:</div>
  <br>
  <div id="tributeText"></div>
</div>
<canvas id="fireworksCanvas"></canvas>
<script src="script.js?v=8"></script>
</body>
</html>
